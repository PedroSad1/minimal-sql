name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --bundles app,dmg --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: add macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Minimal SQL v__VERSION__
          releaseBody: |
            Since 0.1.2 the interface is in English. An Update button appears when a newer release exists. From this version, Update downloads the new app, installs it, and restarts.

            Install:
            - macOS: open the .dmg and drag Minimal SQL to Applications.
            - Windows: open the setup .exe.
            - Linux: open the .deb on Ubuntu or Debian, or open the AppImage. Automatic update uses the AppImage.

            Desde a 0.1.2 a interface está em inglês. O botão Update aparece quando existe uma release mais nova. A partir desta versão, Update baixa o app novo, instala e reabre o programa.

            Instalar:
            - macOS: abra o .dmg e arraste Minimal SQL para Applications.
            - Windows: abra o setup .exe.
            - Linux: abra o .deb no Ubuntu ou Debian, ou abra o AppImage. A atualização automática usa o AppImage.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
