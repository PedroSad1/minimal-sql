[package]
name = "graphite-drivers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
graphite-core = { path = "../graphite-core" }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite.workspace = true
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
bytes = "1"
mysql_async = { version = "0.34", default-features = false, features = ["default"] }
tiberius = { version = "0.12", default-features = false, features = ["chrono", "rustls", "tds73"] }
tokio-util = { version = "0.7", features = ["compat"] }
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
tracing.workspace = true
uuid.workspace = true
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
